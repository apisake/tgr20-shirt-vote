<style>
/* Layout: a gallery index of three shirt cards; each design opens as its own page with a shirt viewer up top,
   then the design notes, the front print and the print sizes. */
:root {
  --paper: #F2F4F0;
  --card: #FFFFFF;
  --ink: #16201C;
  --muted: #586560;
  --line: #D6DCD7;
  --canet: #3A7A64;
  --click: #D9433A;
  --scroll: #6347E8;
  --bean: #74894A;
  --chip: #E7ECE7;
  --display: "Bai Jamjuree", "IBM Plex Sans Thai", Tahoma, sans-serif;
  --body: "IBM Plex Sans Thai", Tahoma, "Noto Sans Thai", sans-serif;
  --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111614; --card: #1A211E; --ink: #EDF1EC; --muted: #9DA9A3; --line: #2A3330;
    --canet: #5FB394; --click: #FF7A70; --scroll: #A894FF; --bean: #A7BF76; --chip: #232B28;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111614; --card: #1A211E; --ink: #EDF1EC; --muted: #9DA9A3; --line: #2A3330;
  --canet: #5FB394; --click: #FF7A70; --scroll: #A894FF; --bean: #A7BF76; --chip: #232B28;
  color-scheme: dark;
}

* { box-sizing: border-box }
body {
  background: var(--paper); color: var(--ink); font: 400 16px/1.65 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 40px 72px; display: grid; gap: 48px }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance }
h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 700 }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700 }
h3 { font-size: 1.15rem; font-weight: 600 }
p { margin: 0 }
.eyebrow { font: 600 0.78rem/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted) }
.lede { font-size: 1.1rem; color: var(--muted); max-width: 62ch }
a { color: inherit }
:focus-visible { outline: 2px solid var(--canet); outline-offset: 3px; border-radius: 6px }

/* ---------- index ---------- */
.intro { display: grid; gap: 14px }
.teams { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 600 0.92rem var(--mono) }
.teams span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; margin-right: 8px; vertical-align: 1px }
.t-canet { color: var(--canet) } .t-click { color: var(--click) } .t-scroll { color: var(--scroll) }
.cta {
  display: grid; gap: 14px; justify-items: start; margin-top: 8px; padding: 20px 22px;
  background: var(--card); border: 1.5px solid var(--canet); border-radius: 14px; max-width: 62ch;
}
.cta p { font: 600 clamp(1.1rem, 2.4vw, 1.3rem)/1.5 var(--display); color: var(--ink) }
.vote {
  justify-self: start; padding: 12px 22px; border-radius: 999px; text-decoration: none;
  font: 600 1.05rem var(--display); background: var(--canet); color: var(--paper);
  transition: transform .18s ease, filter .18s ease;
}
.vote:hover { transform: translateY(-2px); filter: brightness(1.08) }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px }
.design-card {
  display: grid; grid-template-rows: auto 1fr; text-decoration: none; background: var(--card);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  transition: transform .18s ease, border-color .18s ease;
}
.design-card:hover { transform: translateY(-3px); border-color: var(--muted) }
.design-card img { display: block; width: 100%; aspect-ratio: 12 / 7; object-fit: cover; background: #2B3034 }
.design-card .txt { display: grid; gap: 8px; padding: 18px 18px 20px; align-content: start }
.design-card .num { font: 600 0.78rem var(--mono); letter-spacing: 0.1em; color: var(--muted) }
.design-card p { color: var(--muted); font-size: 0.95rem }
.design-card .go { font: 600 0.9rem var(--display); color: var(--ink); margin-top: 6px }
.shared { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; border-top: 1px solid var(--line); padding-top: 28px }
.shared div { display: grid; gap: 6px; align-content: start; min-width: 0 }
.shared p { color: var(--muted); font-size: 0.95rem }

/* ---------- design page ---------- */
.back { font: 600 0.92rem var(--display); text-decoration: none; color: var(--muted); justify-self: start }
.back:hover { color: var(--ink) }
.head { display: grid; gap: 12px }
.viewer { display: grid; gap: 16px }
.stage { background: #2B3034; border-radius: 16px; overflow: hidden }
.stage img { display: block; width: 100%; height: auto; aspect-ratio: 12 / 7 }
.controls { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card) }
.seg button, .people button {
  font: 500 0.92rem var(--body); color: var(--ink); background: none; border: 0; border-radius: 999px;
  padding: 6px 14px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper) }
.people { display: flex; flex-wrap: wrap; gap: 6px }
.people button { background: var(--chip); font-family: var(--mono); font-weight: 600; font-size: 0.85rem; display: inline-flex; gap: 7px; align-items: center }
.people button i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block }
.people button[aria-pressed="true"] { outline: 2px solid currentColor; outline-offset: -2px }
.caption { color: var(--muted); font-size: 0.92rem }

.section { display: grid; gap: 18px; border-top: 1px solid var(--line); padding-top: 28px }
.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 32px }
.note { display: grid; gap: 6px; align-content: start; min-width: 0 }
.note p, .note li { color: var(--muted) }
.note ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px }
code, .mono { font-family: var(--mono); font-size: 0.9em }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px }
.figure { display: grid; gap: 8px; min-width: 0 }
.figure img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line) }
.sizes { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
.sizes th, .sizes td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
.sizes th { font: 600 0.8rem var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted) }
.table-wrap { overflow-x: auto }
.pager { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 24px }
.pager a { text-decoration: none; font: 600 1rem var(--display) }
.pager a span { display: block; font: 500 0.78rem var(--mono); color: var(--muted); letter-spacing: 0.08em }
.motto { font: 700 1.05rem var(--display); letter-spacing: 0.08em }
.motto em { font-style: normal; font-weight: 500; color: var(--bean) }

@media (max-width: 860px) {
  .cards, .shared { grid-template-columns: minmax(0, 1fr) }
  .notes, .split { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: reduce) { .design-card, .vote { transition: none } .design-card:hover, .vote:hover { transform: none } }
</style>
</head>

      <h1>เสื้อทีม TGR#20</h1>
      <p class="lede">ตัวอย่างแบบเสื้อที่เลือกมาแสดงให้ดูว่าถ้าพิมพ์เสื้อแล้วหน้าตาจะเป็นอย่างไร ทั้งเสื้อขาวและเสื้อดำ เลือกแบบเพื่อดูเสื้อของแต่ละแนวคิดการออกแบบ การแสดงเสื้อลองเอาจำนวนคนจากทีมต่าง ๆ มาดังนี้</p>
      <div class="teams"><span class="t-click">muzik.click() · 2 คน</span><span class="t-canet">CANET · 6 คน</span><span class="t-scroll">muzik.scroll() · 2 คน</span></div>
      <div class="cta">
        <p>ลองเปิดดูแบบต่าง ๆ คลิกให้ละเอียดเพื่อตัดสินใจว่าชอบแบบไหน แล้วกดปุ่มข้างล่างนี้</p>
        <a class="vote" href="https://forms.gle/YMQ8jrvZDw1s26Fh6" target="_blank" rel="noopener">กดที่นี่เพื่อโหวตแบบที่ชอบ →</a>
      </div>
    </header>
    <section class="cards" aria-label="แบบเสื้อ">
      ${DESIGNS.map(d => `
        <a class="design-card" href="#${d.token}">
          <img src="img/d${d.n}/cover.webp" alt="แบบที่ ${d.n} ${d.name}: ด้านหน้าบนเสื้อขาว และด้านหลังบนเสื้อดำ" loading="eager">
          <div class="txt">
            <span class="num">แบบที่ ${d.n}</span>
            <h2>${d.name}</h2>
            <p>${d.tagline}</p>
            <span class="go">ดูแบบนี้ →</span>
          </div>
        </a>`).join("")}
    </section>
    <section class="shared" aria-label="สิ่งที่ทุกแบบมีเหมือนกัน">
      <div><h3>ลำดับโลโก้เดียวกัน</h3><p>ทุกแบบเรียง muzik.click() · CANET · muzik.scroll() ให้ CANET อยู่กลาง</p></div>
      <div><h3>ด้านหลังบอกตัวคน</h3><p>ชื่อ ตำแหน่ง CREW หรือ COACH และทีมที่สังกัด ชื่อซ้ำแยกด้วย ♀ / ♂</p></div>
      <div><h3>เสื้อขาวและเสื้อดำ</h3><p>ทุกแบบมีทั้งสองสี ลายปรับเฉดให้อ่านง่ายบนพื้นทั้งสองแบบ และไม่มีลายแขน</p></div>
    </section>`;
}

function backSize(d, pid) {
  if (d.back.h !== "byName") return `${d.back.w.toFixed(1)} × ${d.back.h} cm`;
  return `${d.back.w.toFixed(1)} × ${BACK_H[d.n][pid].toFixed(1)} cm`;
}

function renderDesign(d) {
  document.title = `แบบที่ ${d.n} ${d.name} · TGR#20 Team Shirts`;
  const prev = DESIGNS[(d.n + 1) % 3], next = DESIGNS[d.n % 3];
  app.innerHTML = `
    <a class="back" href="#">← ทุกแบบ</a>
    <header class="head">
      <p class="eyebrow">แบบที่ ${d.n} · ${d.front.where} ${d.front.w.toFixed(1)} × ${d.front.h.toFixed(1)} cm · หลังกว้าง ${d.back.w.toFixed(1)} cm</p>
      <h1>${d.name}</h1>
      <p class="lede">${d.intro}</p>
      ${d.n === 3 ? `<p class="motto">ARS LONGA, <em>ROBUSTA</em> BREVIS</p>` : ""}
    </header>
    <section class="viewer" aria-label="ดูเสื้อของแต่ละคน">
      <div class="stage"><img id="shirt" alt=""></div>
      <div class="controls">
        <div class="seg" role="group" aria-label="สีเสื้อ">
          <button type="button" id="c-white" data-color="white">เสื้อขาว</button>
          <button type="button" id="c-black" data-color="black">เสื้อดำ</button>
        </div>
        <div class="people" role="group" aria-label="เลือกคน">
          ${PEOPLE.map(p => `<button type="button" id="p-${p.id}" class="${team(p)}" data-person="${p.id}"><i></i>${esc(p.name)}</button>`).join("")}
        </div>
      </div>
      <p class="caption" id="cap"></p>
    </section>
    <section class="section">
      <h2>แนวคิดการออกแบบ</h2>
      <div class="notes">
        ${d.notes.map(([h, items]) => `<div class="note"><h3>${h}</h3><ul>${items.map(i => `<li>${i}</li>`).join("")}</ul></div>`).join("")}
      </div>
    </section>
    <section class="section">
      <h2>ลายด้านหน้า</h2>
      <div class="split">
        <figure class="figure" style="margin:0"><img src="img/d${d.n}/chest-white.webp" alt="ลายด้านหน้าบนเสื้อขาว ขยาย"><figcaption class="caption">บนเสื้อขาว</figcaption></figure>
        <figure class="figure" style="margin:0"><img src="img/d${d.n}/chest-black.webp" alt="ลายด้านหน้าบนเสื้อดำ ขยาย"><figcaption class="caption">บนเสื้อดำ</figcaption></figure>
      </div>
      <p class="caption">${d.chestCaption} · ${d.front.note}</p>
    </section>
    <section class="section">
      <h2>ขนาดลาย</h2>
      <div class="split">
        <figure class="figure" style="margin:0"><img src="img/d${d.n}/mockup-white.webp" alt="เสื้อขาวพร้อมเส้นบอกขนาดลาย"><figcaption class="caption">ตัวอย่าง BOSS เสื้อขาว ไซซ์ L</figcaption></figure>
        <figure class="figure" style="margin:0"><img src="img/d${d.n}/mockup-black.webp" alt="เสื้อดำพร้อมเส้นบอกขนาดลาย"><figcaption class="caption">ตัวอย่าง BOSS เสื้อดำ ไซซ์ L</figcaption></figure>
      </div>
      <div class="table-wrap">
        <table class="sizes">
          <thead><tr><th>ชื่อ</th><th>ทีม</th><th>ตำแหน่ง</th><th>${d.front.where}</th><th>ด้านหลัง</th></tr></thead>
          <tbody>${PEOPLE.map(p => `<tr><td class="mono">${esc(p.name)}</td><td class="mono ${team(p)}">${p.team}</td><td>${p.role}</td>
            <td class="mono">${d.front.w.toFixed(1)} × ${d.front.h.toFixed(1)} cm</td><td class="mono">${backSize(d, p.id)}</td></tr>`).join("")}</tbody>
        </table>
      </div>
      <p class="caption">${d.back.note} · ขนาดเท่ากันทั้งเสื้อขาวและเสื้อดำ</p>
    </section>
    <nav class="pager" aria-label="แบบอื่น">
      <a href="#${prev.token}"><span>← แบบที่ ${prev.n}</span>${prev.name}</a>
      <a href="#${next.token}" style="text-align:right"><span>แบบที่ ${next.n} →</span>${next.name}</a>
    </nav>`;
  app.querySelectorAll("[data-color]").forEach(b => b.addEventListener("click", () => { state.color = b.dataset.color; save(); update(d) }));
  app.querySelectorAll("[data-person]").forEach(b => b.addEventListener("click", () => { state.person = b.dataset.person; save(); update(d) }));
  update(d);
}

function update(d) {
  const p = PEOPLE.find(x => x.id === state.person) || PEOPLE[0];
  const img = document.getElementById("shirt");
  img.src = `img/d${d.n}/clean-${p.id}-${state.color}.webp`;
  img.alt = `แบบที่ ${d.n} ของ ${p.name} ทีม ${p.team} ${p.role} ${THAI[state.color]} ด้านหน้าและด้านหลัง`;
  document.getElementById("cap").textContent = `${p.name} · ทีม ${p.team} · ${p.role} · ${THAI[state.color]} · ด้านหลัง ${backSize(d, p.id)}`;
  app.querySelectorAll("[data-color]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.color === state.color)));
  app.querySelectorAll("[data-person]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.person === p.id)));
}

function route() {
  const d = DESIGNS.find(x => "#" + x.token === location.hash);
  d ? renderDesign(d) : renderIndex();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
